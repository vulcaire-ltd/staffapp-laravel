name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: [self-hosted, Linux, X64, vulcaire-local]
    strategy:
      matrix:
        include:
          - php: '8.2'
            testbench: '^9.5'
          - php: '8.3'
            testbench: '^9.5'
          - php: '8.3'
            testbench: '^10.0'
          - php: '8.4'
            testbench: '^10.0'
          - php: '8.4'
            testbench: '^11.0'
          - php: '8.5'
            testbench: '^11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      # Publish staffapp-php 0.1 first; the normal package dependency must resolve.
      - run: composer update --prefer-dist --no-interaction --with 'orchestra/testbench:${{ matrix.testbench }}'
      - run: composer test
