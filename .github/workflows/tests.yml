name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Fork pull requests must not run on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, vulcaire-local]
    strategy:
      matrix:
        include:
          - php: '8.2'
            testbench: '^9.5'
          - php: '8.3'
            testbench: '^9.5'
          - php: '8.3'
            testbench: '^10.0'
          - php: '8.4'
            testbench: '^10.0'
          - php: '8.4'
            testbench: '^9.5'
          - php: '8.5'
            testbench: '^10.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      # vulcaire/staffapp-php ^0.1 must already be on Packagist.
      - run: composer update --prefer-dist --no-interaction --with 'orchestra/testbench:${{ matrix.testbench }}'
      - run: composer test
