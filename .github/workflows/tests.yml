name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
        testbench: ['^10.0', '^11.0']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      # Publish staffapp-php 0.1 first; the normal package dependency must resolve.
      - run: composer update --prefer-dist --no-interaction --with 'orchestra/testbench:${{ matrix.testbench }}'
      - run: composer test
